<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>생일축하해 유진아</title>
  <meta name="theme-color" content="#EEF2F6" />
  <!-- 아이폰 홈 화면에 추가하면 앱처럼 열려요 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="유진이" />
  <meta name="format-detection" content="telephone=no" />
  <link rel="apple-touch-icon" href="/img/icon-180.png" />
  <link rel="icon" href="/img/icon-180.png" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- 1. 생일 화면 -->
  <section id="screen-birthday" class="screen birthday" aria-labelledby="bday-title">
    <div class="bday-inner">
      <button type="button" class="polaroid hero-photo" id="hero-photo" aria-label="사진을 누르면 축하 꽃가루가 터져요">
        <span class="tape" aria-hidden="true"></span>
        <img src="/img/us.webp" alt="술집에서 하트를 그리는 지원이와 셀카를 찍는 유진이" />
        <span class="polaroid-caption">대전 또 가고싶으네..</span>
      </button>

      <div class="bday-text">
        <p class="bday-emoji" data-emoji="🎂🎉🥳" aria-hidden="true"></p>
        <h1 id="bday-title" class="bday-title">
          <span class="hl-line"><span class="hl">생일축하해</span></span>
          <span class="hl-line"><span class="hl">유진아</span></span>
        </h1>
        <p class="bday-sub" id="bday-sub">유진이의 생일</p>
        <p class="bday-note">사진을 눌러봐</p>
        <button type="button" class="btn btn-ink" id="open-diary">교환일기 펼치기</button>
      </div>
    </div>
  </section>

  <!-- 2. 로그인 -->
  <section id="screen-login" class="screen login" hidden aria-labelledby="login-title">
    <form class="sheet login-sheet" id="login-form" autocomplete="on">
      <h2 id="login-title" class="hand-title">누가 펼쳤어?</h2>
      <p class="muted">이 일기장은 우리 둘만 열 수 있어.</p>
      <div class="who" role="radiogroup" aria-label="나는 누구">
        <!-- people from server -->
      </div>
      <label class="field">
        <span>전화번호 뒷자리 4개</span>
        <input type="password" id="login-password" class="pin" inputmode="numeric" pattern="[0-9]{4}"
               maxlength="4" autocomplete="off" placeholder="••••" required />
      </label>
      <p class="error" id="login-error" role="alert"></p>
      <div class="row">
        <button type="button" class="btn btn-ghost" id="back-to-bday">생일 화면으로</button>
        <button type="submit" class="btn btn-ink">일기장 열기</button>
      </div>
    </form>
  </section>

  <!-- 3. 교환일기 -->
  <section id="screen-diary" class="screen diary" hidden aria-labelledby="diary-title">
    <header class="diary-head">
      <div>
        <h2 id="diary-title" class="hand-title emojify">유진 💗 지원의 교환일기</h2>
        <p class="turn" id="turn"></p>
      </div>
      <nav class="head-actions">
        <button type="button" class="btn btn-ink btn-sm emojify" id="open-game">지원이 줘패기 ⚾</button>
        <button type="button" class="btn btn-ghost btn-sm" id="show-bday">생일 화면</button>
        <button type="button" class="btn btn-ghost btn-sm" id="logout">나가기</button>
      </nav>
    </header>

    <form class="sheet composer" id="composer">
      <label for="entry-text" class="composer-label" id="composer-label">오늘 이야기를 써줘</label>
      <textarea id="entry-text" rows="6" maxlength="5000" placeholder="오늘 있었던 일, 하고 싶은 말, 아무거나"></textarea>

      <fieldset class="moods">
        <legend>오늘 기분</legend>
        <div class="mood-list" id="mood-list"></div>
      </fieldset>

      <div class="previews" id="previews" aria-live="polite"></div>

      <div class="composer-bar">
        <label class="btn btn-ghost photo-pick">
          <input type="file" id="entry-photos" accept="image/*" multiple />
          사진 붙이기
        </label>
        <span class="muted small" id="photo-count">사진은 4장까지</span>
        <button type="submit" class="btn btn-ink" id="submit-entry">일기 남기기</button>
      </div>
      <p class="error" id="composer-error" role="alert"></p>
    </form>

    <div class="tabs" role="tablist" aria-label="누가 쓴 일기 볼까" id="writer-tabs">
      <button type="button" role="tab" data-filter="all" aria-selected="true">전체</button>
      <button type="button" role="tab" data-filter="me" aria-selected="false">지원</button>
      <button type="button" role="tab" data-filter="yujin" aria-selected="false">유진</button>
    </div>

    <ol class="entries" id="entries" aria-label="지금까지 쓴 일기"></ol>
  </section>

  <!-- 4. 지원이 줘패기 게임 -->
  <section id="screen-game" class="screen game" hidden aria-labelledby="game-title">
    <header class="game-head">
      <button type="button" class="btn btn-ghost btn-sm" id="game-back">일기장으로</button>
      <h2 id="game-title" class="hand-title">지원이 줘패기</h2>
      <div class="game-stats" aria-live="polite">
        <span class="stat"><b id="g-score">0</b>점</span>
        <span class="stat"><b id="g-time">30</b>초</span>
      </div>
    </header>
    <p class="game-best" id="g-best"></p>

    <div class="board-wrap">
      <div class="board" id="board" aria-label="지원이가 튀어나오는 구멍들"></div>

      <div class="game-overlay" id="g-overlay">
        <div class="sheet overlay-card">
          <img src="/img/jiwon.webp" alt="" class="overlay-face" />
          <h3 class="hand-title" id="g-ov-title">지원이를 혼내줄 시간</h3>
          <p id="g-ov-text">30초 동안 튀어나오는 지원이를 방망이로 때려줘. 빨리 때릴수록 점수가 커져.</p>
          <button type="button" class="btn btn-ink" id="g-start">시작하기</button>
        </div>
      </div>
    </div>

    <div class="bat" id="bat" aria-hidden="true">
      <svg viewBox="0 0 40 200" width="40" height="200">
        <defs>
          <linearGradient id="batShade" x1="0" x2="1">
            <stop offset="0" stop-color="#ff7a1a" />
            <stop offset=".45" stop-color="#ff9a4a" />
            <stop offset="1" stop-color="#e45d00" />
          </linearGradient>
        </defs>
        <path d="M8 18 Q8 4 20 4 Q32 4 32 18 L27 120 L13 120 Z" fill="url(#batShade)" stroke="#1d2b4f" stroke-width="2.5" />
        <rect x="9" y="30" width="22" height="4" fill="#1d2b4f" />
        <path d="M13 120 L27 120 L25 186 L15 186 Z" fill="#fff" stroke="#1d2b4f" stroke-width="2.5" />
        <rect x="11" y="186" width="18" height="8" rx="3" fill="#ff7a1a" stroke="#1d2b4f" stroke-width="2.5" />
      </svg>
    </div>
  </section>

  <!-- 아이폰 하단 탭바 (폰에서만 보여요) -->
  <nav class="tabbar" id="tabbar" hidden aria-label="메뉴">
    <button type="button" data-go="diary"><span class="ti" data-emoji="📒"></span><span>일기</span></button>
    <button type="button" data-go="game"><span class="ti" data-emoji="⚾"></span><span>줘패기</span></button>
    <button type="button" data-go="bday"><span class="ti" data-emoji="🎂"></span><span>생일</span></button>
    <button type="button" data-go="logout"><span class="ti" data-emoji="👋"></span><span>나가기</span></button>
  </nav>

  <!-- 사진 크게 보기 -->
  <dialog id="lightbox" class="lightbox">
    <img id="lightbox-img" alt="" />
    <button type="button" class="btn btn-ink btn-sm" id="lightbox-close">닫기</button>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>

  <script src="/app.js"></script>
  <script src="/game.js"></script>
</body>
</html>
